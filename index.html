* { box-sizing: border-box; }

html, body, #root {
  width: 100%; height: 100%;
  margin: 0; padding: 0; border: 0;
}

body {
  font-family: 'Hedley New', 'Hind', system-ui, -apple-system, sans-serif;
  background-color: var(--md-sys-color-background);
  color: var(--md-sys-color-on-background);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Layout ---------- */
.app-shell { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

.app-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 12px 16px; min-height: 64px;
  background-color: var(--md-sys-color-surface-container-lowest);
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
  flex: 0 0 auto;
}
.logo-container { display: flex; align-items: center; padding: 0 16px 0 0; }
.brand-logo {
  display: block; height: 34px; width: 101px;
  background-image: var(--kv-logo);
  background-repeat: no-repeat; background-size: contain; background-position: left center;
}
.app-title {
  margin: 0; font-size: 13px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--md-sys-color-on-surface); flex: 1 1 auto;
}
.app-title small {
  display: block; font-size: 10px; font-weight: 400; letter-spacing: 0.1em;
  color: var(--md-sys-color-on-surface-variant); text-transform: none;
}

.app-tabs {
  display: flex; flex: 0 0 auto;
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
  background-color: var(--md-sys-color-surface-container-low);
}
.app-tabs button {
  flex: 1 1 0; min-height: 48px; padding: 0 8px;
  background: transparent; border: 0; border-bottom: 2px solid transparent;
  border-radius: 0; cursor: pointer;
  font-family: inherit; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--md-sys-color-on-surface-variant);
}
.app-tabs button[aria-selected="true"] {
  color: var(--md-sys-color-primary);
  border-bottom-color: var(--md-sys-color-primary);
  background-color: var(--md-sys-color-surface-container);
}

.app-main { flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

.app-footer {
  flex: 0 0 auto; padding: 10px 16px;
  border-top: 1px solid var(--md-sys-color-outline-variant);
  background-color: var(--md-sys-color-surface-container-lowest);
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--md-sys-color-on-surface-variant);
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}

const GIRAFFE_SDK_ESM = 'https://esm.sh/@gi-nx/iframe-sdk@0.0.13';

  IFCWALL: { color: '#9E9E9E', opacity: 1 },
  IFCWALLSTANDARDCASE: { color: '#9E9E9E', opacity: 1 },
  IFCSLAB: { color: '#6D8196', opacity: 1 },
  IFCROOF: { color: '#455A64', opacity: 1 },
  IFCCOLUMN: { color: '#5D4037', opacity: 1 },
  IFCBEAM: { color: '#795548', opacity: 1 },
  IFCWINDOW: { color: '#4FC3F7', opacity: 0.45 },
  IFCDOOR: { color: '#A1887F', opacity: 1 },
  IFCSTAIR: { color: '#78909C', opacity: 1 },
  IFCSTAIRFLIGHT: { color: '#78909C', opacity: 1 },
  IFCRAILING: { color: '#B0BEC5', opacity: 0.8 },
  IFCCURTAINWALL: { color: '#90CAF9', opacity: 0.5 },
  IFCPLATE: { color: '#B0BEC5', opacity: 0.7 },
  IFCMEMBER: { color: '#8D6E63', opacity: 1 },
  IFCCOVERING: { color: '#CFD8DC', opacity: 1 },
  IFCSPACE: { color: '#B2DFDB', opacity: 0.35 },
  IFCRAMP: { color: '#78909C', opacity: 1 },
  IFCFOOTING: { color: '#6D4C41', opacity: 1 },
  IFCPILE: { color: '#6D4C41', opacity: 1 },
  IFCFURNISHINGELEMENT: { color: '#BCAAA4', opacity: 1 },
  IFCBUILDINGELEMENTPROXY: { color: '#80838D', opacity: 1 },
};

const DEFAULT_STYLE = { color: '#80838D', opacity: 1 };

/** Tipos lidos mas desmarcados por padrão (não são massa construída). */
const OFF_BY_DEFAULT = new Set([
  'IFCSPACE', 'IFCFURNISHINGELEMENT', 'IFCFURNITURE', 'IFCOPENINGELEMENT',
  'IFCANNOTATION', 'IFCGRID', 'IFCVIRTUALELEMENT', 'IFCSPATIALZONE',
]);

/** Cor estável para categorias IFC fora da tabela curada. */
function autoColor(name: string): string {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  const hue = h % 360, s = 0.16, l = 0.55;
  const f = (n: number) => {
    const k = (n + hue / 30) % 12;
    const c = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(c * 255).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}

function getStyle(name: string): { color: string; opacity: number } {
  return CATEGORY_STYLE[name] || { color: autoColor(name), opacity: 1 };
}

const prettyCategory = (c: string): string =>
  c.replace(/^IFC/, 'Ifc').replace(/^(Ifc)([A-Z]+)$/, (_m, a, b) => a + b.charAt(0) + b.slice(1).toLowerCase());

/* =========================================================================
   3. UTILITÁRIOS GERAIS
   ========================================================================= */

const sleep = (ms: number) => new Promise<void>((r) => setTimeout(r, ms));
const clamp = (v: number, a: number, b: number) => Math.min(b, Math.max(a, v));
const round = (v: number, d: number) => Math.round(v * 10 ** d) / 10 ** d;

const sanitizeKey = (s: string): string =>
  String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 48);

/* =========================================================================
   4. GEOMETRIA 2D
   ========================================================================= */

function ringArea(ring: Ring): number {
  let a = 0;
  for (let i = 0, n = ring.length; i < n; i++) {
    const p = ring[i];
    const q = ring[(i + 1) % n];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return a / 2;
}

function ringPerimeter(ring: Ring): number {
  let p = 0;
  for (let i = 0, n = ring.length; i < n; i++) {
    const a = ring[i];
    const b = ring[(i + 1) % n];
    p += Math.hypot(b[0] - a[0], b[1] - a[1]);
  }
  return p;
}

function ringCentroid(ring: Ring): Vec2 {
  const a = ringArea(ring);
  if (Math.abs(a) < 1e-9) {
    let sx = 0, sy = 0;
    ring.forEach((p) => { sx += p[0]; sy += p[1]; });
    return [sx / ring.length, sy / ring.length];
  }
  let cx = 0, cy = 0;
  for (let i = 0, n = ring.length; i < n; i++) {
    const p = ring[i];
    const q = ring[(i + 1) % n];
    const f = p[0] * q[1] - q[0] * p[1];
    cx += (p[0] + q[0]) * f;
    cy += (p[1] + q[1]) * f;
  }
  return [cx / (6 * a), cy / (6 * a)];
}

/** Envoltória convexa — cadeia monótona de Andrew. */
function convexHull(pts: number[]): Ring {
  const n = pts.length / 2;
  if (n < 3) return [];
  const arr: Ring = [];
  for (let i = 0; i < n; i++) arr.push([pts[i * 2], pts[i * 2 + 1]]);
  arr.sort((a, b) => (a[0] === b[0] ? a[1] - b[1] : a[0] - b[0]));
  const cross = (o: Vec2, a: Vec2, b: Vec2) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower: Ring = [];
  for (const p of arr) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper: Ring = [];
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

/** Douglas–Peucker. */
function simplifyRing(ring: Ring, eps: number): Ring {
  if (ring.length < 4) return ring;
  const closed = ring.concat([ring[0]]);
  const keep = new Uint8Array(closed.length);
  keep[0] = 1; keep[closed.length - 1] = 1;
  const stack: Array<[number, number]> = [[0, closed.length - 1]];
  while (stack.length) {
    const seg = stack.pop() as [number, number];
    const [s, e] = seg;
    if (e <= s + 1) continue;
    const a = closed[s], b = closed[e];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1e-9;
    let best = -1, bestD = eps;
    for (let i = s + 1; i < e; i++) {
      const p = closed[i];
      const d = Math.abs(dy * (p[0] - a[0]) - dx * (p[1] - a[1])) / len;
      if (d > bestD) { bestD = d; best = i; }
    }
    if (best > 0) { keep[best] = 1; stack.push([s, best], [best, e]); }
  }
  const out: Ring = [];
  for (let i = 0; i < closed.length - 1; i++) if (keep[i]) out.push(closed[i]);
  return out.length >= 3 ? out : ring;
}

/** Remove vértices praticamente colineares (< 1°). */
function dropCollinear(ring: Ring, angleDeg = 1): Ring {
  if (ring.length < 4) return ring;
  const lim = Math.cos((180 - angleDeg) * Math.PI / 180);
  const out: Ring = [];
  const n = ring.length;
  for (let i = 0; i < n; i++) {
    const a = ring[(i - 1 + n) % n], b = ring[i], c = ring[(i + 1) % n];
    const v1x = a[0] - b[0], v1y = a[1] - b[1];
    const v2x = c[0] - b[0], v2y = c[1] - b[1];
    const l1 = Math.hypot(v1x, v1y) || 1e-9;
    const l2 = Math.hypot(v2x, v2y) || 1e-9;
    const cosang = (v1x * v2x + v1y * v2y) / (l1 * l2);
    if (cosang > lim) continue; // ângulo ~180°, vértice redundante
    out.push(b);
  }
  return out.length >= 3 ? out : ring;
}

/** Ponto dentro de triângulo (teste de sinais). */
function pointInTri(
  px: number, py: number,
  ax: number, ay: number, bx: number, by: number, cx: number, cy: number
): boolean {
  const d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by);
  const d2 = (px - cx) * (by - cy) - (bx - cx) * (py - cy);
  const d3 = (px - ax) * (cy - ay) - (cx - ax) * (py - ay);
  const neg = d1 < 0 || d2 < 0 || d3 < 0;
  const pos = d1 > 0 || d2 > 0 || d3 > 0;
  return !(neg && pos);
}

/** SAT: triângulo 2D vs AABB. */
function triAabbOverlap(
  ax: number, ay: number, bx: number, by: number, cx: number, cy: number,
  minx: number, miny: number, maxx: number, maxy: number
): boolean {
  if (Math.min(ax, bx, cx) > maxx || Math.max(ax, bx, cx) < minx) return false;
  if (Math.min(ay, by, cy) > maxy || Math.max(ay, by, cy) < miny) return false;
  const tx = [ax, bx, cx], ty = [ay, by, cy];
  const rx = [minx, maxx, maxx, minx], ry = [miny, miny, maxy, maxy];
  for (let i = 0; i < 3; i++) {
    const j = (i + 1) % 3;
    const nx = -(ty[j] - ty[i]);
    const ny = tx[j] - tx[i];
    let tmin = Infinity, tmax = -Infinity, rmin = Infinity, rmax = -Infinity;
    for (let k = 0; k < 3; k++) { const p = nx * tx[k] + ny * ty[k]; tmin = Math.min(tmin, p); tmax = Math.max(tmax, p); }
    for (let k = 0; k < 4; k++) { const p = nx * rx[k] + ny * ry[k]; rmin = Math.min(rmin, p); rmax = Math.max(rmax, p); }
    if (tmax < rmin || rmax < tmin) return false;
  }
  return true;
}

/**
 * Contorno rasterizado: projeta triângulos numa grade, extrai as arestas de
 * fronteira das células preenchidas e encadeia em anéis (exterior + furos).
 * Substitui união booleana de polígonos — determinístico e O(n).
 */
function rasterFootprint(tris: number[], cell: number, maxCells: number): Ring[] {
  const nTri = tris.length / 6;
  if (nTri < 1) return [];
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (let i = 0; i < tris.length; i += 2) {
    if (tris[i] < minx) minx = tris[i];
    if (tris[i] > maxx) maxx = tris[i];
    if (tris[i + 1] < miny) miny = tris[i + 1];
    if (tris[i + 1] > maxy) maxy = tris[i + 1];
  }
  const w = maxx - minx, h = maxy - miny;
  if (!(w > 0) || !(h > 0)) return [];

  let cs = cell;
  while (Math.ceil(w / cs) * Math.ceil(h / cs) > maxCells) cs *= 1.5;

  const nx = Math.ceil(w / cs) + 2;
  const ny = Math.ceil(h / cs) + 2;
  const ox = minx - cs, oy = miny - cs;
  const grid = new Uint8Array(nx * ny);

  // Passe A: amostragem no centro da célula (sem viés sistemático de área).
  // Passe B (fallback): sobreposição conservadora, para elementos finos que
  // não capturam nenhum centro de célula (paredes, montantes, perfis).
  const fill = (conservative: boolean) => {
    let hits = 0;
    for (let t = 0; t < nTri; t++) {
      const k = t * 6;
      const ax = tris[k], ay = tris[k + 1], bx = tris[k + 2], by = tris[k + 3], cx = tris[k + 4], cy = tris[k + 5];
      const i0 = clamp(Math.floor((Math.min(ax, bx, cx) - ox) / cs), 0, nx - 1);
      const i1 = clamp(Math.floor((Math.max(ax, bx, cx) - ox) / cs), 0, nx - 1);
      const j0 = clamp(Math.floor((Math.min(ay, by, cy) - oy) / cs), 0, ny - 1);
      const j1 = clamp(Math.floor((Math.max(ay, by, cy) - oy) / cs), 0, ny - 1);
      for (let j = j0; j <= j1; j++) {
        for (let i = i0; i <= i1; i++) {
          const idx = j * nx + i;
          if (grid[idx]) continue;
          const hit = conservative
            ? triAabbOverlap(ax, ay, bx, by, cx, cy, ox + i * cs, oy + j * cs, ox + (i + 1) * cs, oy + (j + 1) * cs)
            : pointInTri(ox + (i + 0.5) * cs, oy + (j + 0.5) * cs, ax, ay, bx, by, cx, cy);
          if (hit) { grid[idx] = 1; hits++; }
        }
      }
    }
    return hits;
  };
  if (fill(false) === 0) fill(true);

  // Arestas de fronteira, orientadas CCW ao redor de cada célula preenchida.
  const edges: number[] = []; // x0,y0,x1,y1 (coordenadas inteiras de grade)
  const filled = (i: number, j: number) => (i < 0 || j < 0 || i >= nx || j >= ny ? 0 : grid[j * nx + i]);
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      if (!grid[j * nx + i]) continue;
      if (!filled(i, j - 1)) edges.push(i, j, i + 1, j);
      if (!filled(i + 1, j)) edges.push(i + 1, j, i + 1, j + 1);
      if (!filled(i, j + 1)) edges.push(i + 1, j + 1, i, j + 1);
      if (!filled(i - 1, j)) edges.push(i, j + 1, i, j);
    }
  }
  if (!edges.length) return [];

  const startMap = new Map<number, number[]>();
  const nEdges = edges.length / 4;
  const key = (x: number, y: number) => y * (nx + 2) + x;
  for (let e = 0; e < nEdges; e++) {
    const k = key(edges[e * 4], edges[e * 4 + 1]);
    const list = startMap.get(k);
    if (list) list.push(e); else startMap.set(k, [e]);
  }

  const used = new Uint8Array(nEdges);
  const loops: Ring[] = [];
  for (let seed = 0; seed < nEdges; seed++) {
    if (used[seed]) continue;
    const loop: Ring = [];
    let cur = seed;
    let guard = 0;
    while (cur >= 0 && !used[cur] && guard++ < nEdges + 4) {
      used[cur] = 1;
      const x0 = edges[cur * 4], y0 = edges[cur * 4 + 1];
      const x1 = edges[cur * 4 + 2], y1 = edges[cur * 4 + 3];
      loop.push([ox + x0 * cs, oy + y0 * cs]);
      const dx = x1 - x0, dy = y1 - y0;
      const cands = startMap.get(key(x1, y1)) || [];
      // Preferência: direita, reto, esquerda, volta (garante separação de anéis).
      const prefs: Vec2[] = [[dy, -dx], [dx, dy], [-dy, dx], [-dx, -dy]];
      let next = -1;
      for (const p of prefs) {
        for (const c of cands) {
          if (used[c]) continue;
          if (edges[c * 4 + 2] - edges[c * 4] === p[0] && edges[c * 4 + 3] - edges[c * 4 + 1] === p[1]) { next = c; break; }
        }
        if (next >= 0) break;
      }
      cur = next;
    }
    if (loop.length >= 4) loops.push(loop);
  }
  return loops;
}

/** Constrói os anéis finais (exterior + furos) a partir dos loops rasterizados. */
function ringsFromLoops(loops: Ring[], tol: number, minHoleArea: number): Ring[] {
  const scored = loops
    .map((l) => ({ ring: dropCollinear(simplifyRing(l, tol)), a: ringArea(l) }))
    .filter((o) => o.ring.length >= 3);
  if (!scored.length) return [];
  scored.sort((p, q) => Math.abs(q.a) - Math.abs(p.a));
  const outer = scored[0];
  const rings: Ring[] = [outer.a > 0 ? outer.ring : outer.ring.slice().reverse()];
  for (let i = 1; i < scored.length; i++) {
    const s = scored[i];
    if (Math.abs(s.a) < minHoleArea) continue;
    if (s.a > 0) continue; // outro componente desconexo — ignorado
    rings.push(s.ring.slice().reverse()); // furo com sentido oposto ao anel externo
  }
  return rings;
}

/* =========================================================================
   5. GEORREFERENCIAMENTO (WGS84)
   ========================================================================= */

/** Metros por grau, corrigidos pela latitude (evita o erro do 111320 fixo). */
function metersPerDegree(latDeg: number): { mLat: number; mLon: number } {
  const p = (latDeg * Math.PI) / 180;
  const mLat = 111132.92 - 559.82 * Math.cos(2 * p) + 1.175 * Math.cos(4 * p) - 0.0023 * Math.cos(6 * p);
  const mLon = 111412.84 * Math.cos(p) - 93.5 * Math.cos(3 * p) + 0.118 * Math.cos(5 * p);
  return { mLat, mLon: Math.abs(mLon) < 1 ? 1 : mLon };
}

function makeProjector(anchor: Anchor) {
  const { mLat, mLon } = metersPerDegree(anchor.lat);
  const th = (anchor.rotation * Math.PI) / 180;
  const cos = Math.cos(th), sin = Math.sin(th);
  return (x: number, y: number): Vec2 => {
    const xr = x * cos - y * sin;
    const yr = x * sin + y * cos;
    return [anchor.lon + xr / mLon, anchor.lat + yr / mLat];
  };
}

/** IfcCompoundPlaneAngleMeasure -> graus decimais. */
function ifcAngleToDeg(v: unknown): number | null {
  if (!Array.isArray(v) || !v.length) return null;
  const n = v.map((e: any) => (typeof e === 'number' ? e : e?.value ?? 0));
  const sign = n[0] < 0 ? -1 : 1;
  const deg = Math.abs(n[0]) + (n[1] || 0) / 60 + (n[2] || 0) / 3600 + (n[3] || 0) / 3600e6;
  return sign * deg;
}

/* =========================================================================
   6. CARREGAMENTO DE DEPENDÊNCIAS (dinâmico, tolerante a falha)
   ========================================================================= */

type Reporter = (v: number, msg: string, lv?: LogLevel) => void;

let _webifc: any = null;
let _api: any = null;
let _sdk: any = null;
let _wasmBaseUsed = '';

async function loadWebIfc(report: Reporter): Promise<any> {
  if (_api) return _api;
  report(0.02, 'Carregando web-ifc (WebAssembly)…');
  if (!_webifc) _webifc = await import(/* @vite-ignore */ WEB_IFC_ESM);
  let lastErr: unknown = null;
  for (const base of WASM_BASES) {
    try {
      const api = new _webifc.IfcAPI();
      api.SetWasmPath(base, true);
      await api.Init();
      _api = api;
      _wasmBaseUsed = base;
      report(0.06, 'WASM inicializado: ' + base, 'ok');
      return api;
    } catch (e) {
      lastErr = e;
      report(0.02, 'Falha no WASM em ' + base + ' — tentando alternativa.', 'warn');
    }
  }
  throw lastErr || new Error('Não foi possível inicializar o web-ifc');
}

async function loadSdk(): Promise<any> {
  if (_sdk) return _sdk;
  _sdk = await import(/* @vite-ignore */ GIRAFFE_SDK_ESM);
  return _sdk;
}

/* =========================================================================
   7. MOTOR DE IMPORTAÇÃO IFC
   ========================================================================= */

class IfcImportEngine {
  private api: any;
  private W: any;
  private modelID = -1;
  private report: Reporter;

  public unitScale = 1;
  public verticalAxis: 'z' | 'y' = 'z';
  public modelCenter: Vec2 = [0, 0];
  public ifcGeo: { lon: number; lat: number; elev: number } | null = null;

  constructor(api: any, webifc: any, report: Reporter) {
    this.api = api; this.W = webifc; this.report = report;
  }

  open(buffer: ArrayBuffer): void {
    this.modelID = this.api.OpenModel(new Uint8Array(buffer), {
      COORDINATE_TO_ORIGIN: false,
      USE_FAST_BOOLS: true,
    });
  }

  close(): void {
    if (this.modelID >= 0) { try { this.api.CloseModel(this.modelID); } catch (e) { /* noop */ } }
    this.modelID = -1;
  }

  private lines(type: number): number[] {
    const out: number[] = [];
    if (typeof type !== 'number') return out;
    try {
      const v = this.api.GetLineIDsWithType(this.modelID, type);
      for (let i = 0; i < v.size(); i++) out.push(v.get(i));
    } catch (e) { /* tipo ausente no schema */ }
    return out;
  }

  private line(id: number): any {
    try { return this.api.GetLine(this.modelID, id); } catch (e) { return null; }
  }

  /* ---------- Unidades ---------- */
  detectUnitScale(): number {
    const PREFIX: Record<string, number> = {
      EXA: 1e18, PETA: 1e15, TERA: 1e12, GIGA: 1e9, MEGA: 1e6, KILO: 1e3, HECTO: 1e2, DECA: 1e1,
      DECI: 1e-1, CENTI: 1e-2, MILLI: 1e-3, MICRO: 1e-6, NANO: 1e-9,
    };
    let scale = 1;
    for (const pid of this.lines(this.W.IFCPROJECT)) {
      const proj = this.line(pid);
      const ua = proj?.UnitsInContext?.value ? this.line(proj.UnitsInContext.value) : null;
      if (!ua?.Units) continue;
      for (const ref of ua.Units) {
        const u = this.line(ref.value);
        if (!u) continue;
        const ut = u.UnitType?.value;
        if (ut !== 'LENGTHUNIT') continue;
        if (u.Prefix?.value) scale = PREFIX[u.Prefix.value] ?? 1;
        else if (u.ConversionFactor?.value) {
          const cf = this.line(u.ConversionFactor.value);
          const val = cf?.ValueComponent?.value;
          if (typeof val === 'number') scale = val;
        } else scale = 1;
      }
    }
    this.unitScale = scale;
    return scale;
  }

  /* ---------- Georreferenciamento nativo do IFC ---------- */
  detectGeoRef(): { lon: number; lat: number; elev: number } | null {
    for (const sid of this.lines(this.W.IFCSITE)) {
      const site = this.line(sid);
      if (!site) continue;
      const lat = ifcAngleToDeg(site.RefLatitude);
      const lon = ifcAngleToDeg(site.RefLongitude);
      if (lat !== null && lon !== null && (lat !== 0 || lon !== 0)) {
        const elev = typeof site.RefElevation?.value === 'number' ? site.RefElevation.value : 0;
        this.ifcGeo = { lon, lat, elev };
        return this.ifcGeo;
      }
    }
    return null;
  }

  /* ---------- Hierarquia espacial + Psets ---------- */
  readMeta(): Map<number, IfcMeta> {
    const meta = new Map<number, IfcMeta>();

    // Agregação (Project -> Site -> Building -> Storey)
    const parentOf = new Map<number, number>();
    for (const rid of this.lines(this.W.IFCRELAGGREGATES)) {
      const rel = this.line(rid);
      if (!rel?.RelatingObject || !rel.RelatedObjects) continue;
      for (const o of rel.RelatedObjects) parentOf.set(o.value, rel.RelatingObject.value);
    }

    const storeyName = new Map<number, string>();
    const storeyElev = new Map<number, number>();
    const buildingOfStorey = new Map<number, string>();

    const buildingName = new Map<number, string>();
    for (const bid of this.lines(this.W.IFCBUILDING)) {
      const b = this.line(bid);
      buildingName.set(bid, b?.Name?.value || b?.LongName?.value || 'Edifício ' + bid);
    }
    for (const sid of this.lines(this.W.IFCBUILDINGSTOREY)) {
      const s = this.line(sid);
      storeyName.set(sid, s?.Name?.value || s?.LongName?.value || 'Pavimento ' + sid);
      storeyElev.set(sid, typeof s?.Elevation?.value === 'number' ? s.Elevation.value : NaN);
      let p = parentOf.get(sid);
      let guard = 0;
      while (p !== undefined && guard++ < 12) {
        if (buildingName.has(p)) { buildingOfStorey.set(sid, buildingName.get(p) as string); break; }
        p = parentOf.get(p);
      }
    }

    // Contenção espacial (Storey -> elementos)
    const structureOf = new Map<number, number>();
    for (const rid of this.lines(this.W.IFCRELCONTAINEDINSPATIALSTRUCTURE)) {
      const rel = this.line(rid);
      if (!rel?.RelatingStructure || !rel.RelatedElements) continue;
      for (const e of rel.RelatedElements) structureOf.set(e.value, rel.RelatingStructure.value);
    }

    // Psets
    const psetsOf = new Map<number, Record<string, Record<string, unknown>>>();
    for (const rid of this.lines(this.W.IFCRELDEFINESBYPROPERTIES)) {
      const rel = this.line(rid);
      const pid = rel?.RelatingPropertyDefinition?.value;
      if (!pid || !rel.RelatedObjects) continue;
      const pset = this.line(pid);
      if (!pset?.HasProperties) continue;
      const setName = pset.Name?.value || 'Pset';
      const props: Record<string, unknown> = {};
      for (const pr of pset.HasProperties) {
        const p = this.line(pr.value);
        const k = p?.Name?.value;
        if (!k) continue;
        const raw = p.NominalValue?.value;
        props[k] = raw === undefined || raw === null ? '' : raw;
      }
      for (const o of rel.RelatedObjects) {
        const cur = psetsOf.get(o.value) || {};
        cur[setName] = { ...(cur[setName] || {}), ...props };
        psetsOf.set(o.value, cur);
      }
    }

    const attach = (id: number) => {
      const el = this.line(id);
      const st = structureOf.get(id);
      meta.set(id, {
        globalId: el?.GlobalId?.value || '',
        name: el?.Name?.value || '',
        description: el?.Description?.value || '',
        storey: st !== undefined ? (storeyName.get(st) || '') : '',
        storeyElevation: st !== undefined && !Number.isNaN(storeyElev.get(st) as number) ? (storeyElev.get(st) as number) : null,
        building: st !== undefined ? (buildingOfStorey.get(st) || '') : '',
        psets: psetsOf.get(id) || {},
      });
    };

    structureOf.forEach((_v, k) => attach(k));
    psetsOf.forEach((_v, k) => { if (!meta.has(k)) attach(k); });
    return meta;
  }

  /* ---------- Geometria ---------- */
  /**
   * Tipos a percorrer. Por padrão são extraídos do próprio arquivo via
   * GetIfcEntityList + GetNameFromTypeCode, preservando a classificação IFC
   * original (IfcCovering continua IfcCovering, IfcSlabStandardCase continua
   * IfcSlabStandardCase). O filtro remove apenas entidades não-produto
   * (geometria primitiva, relacionamentos, unidades, estilos, contêineres
   * espaciais). A lista curada é usada apenas como fallback.
   */
  private typeCodes(opts: ImportOptions): Array<{ code: number; name: string }> {
    const NON_PRODUCT = /^IFC(REL|PROPERTY|QUANTITY|ELEMENTQUANTITY|MATERIAL|PRESENTATION|STYLED|SURFACESTYLE|COLOUR|CURVESTYLE|FILLAREA|TEXTSTYLE|GEOMETRIC|CARTESIAN|DIRECTION|AXIS|PLACEMENT|LOCALPLACEMENT|OBJECTPLACEMENT|POLYLINE|POLYLOOP|FACE|CLOSEDSHELL|OPENSHELL|SHELLBASED|CONNECTED|CONNECTION|EXTRUDED|SWEPT|BOOLEAN|HALFSPACE|PLANE|CIRCLE|ELLIPSE|LINE|TRIMMED|COMPOSITE|BSPLINE|INDEXED|TRIANGULATED|POLYGONAL|SHAPE|PRODUCTDEFINITION|REPRESENTATION|MAPPED|PROFILE|SIUNIT|UNIT|MEASURE|PERSON|ORGANIZATION|APPLICATION|OWNERHISTORY|CLASSIFICATION|LIBRARY|DOCUMENT|ADDRESS|TABLE|TIME|DATE|MONETARY|DERIVED|CONVERSION|DIMENSIONAL|NAMEDUNIT|CONTEXT|VERTEX|EDGE|LOOP|PATH|CURVE|POINT|VECTOR|BOUNDING|CARTESIANTRANSFORM|PROJECT$|SITE$|BUILDING$|BUILDINGSTOREY$)/;

    const curated = (): Array<{ code: number; name: string }> => {
      const out: Array<{ code: number; name: string }> = [];
      for (const n of Object.keys(CATEGORY_STYLE)) {
        const code = this.W[n];
        if (typeof code === 'number') out.push({ code, name: n });
      }
      return out;
    };

    if (!opts.includeAllTypes) return curated();

    let codes: number[] = [];
    try { codes = this.api.GetIfcEntityList(this.modelID) || []; } catch (e) { codes = []; }
    if (!codes.length) {
      this.report(0, 'GetIfcEntityList indisponível — usando lista curada de tipos.', 'warn');
      return curated();
    }

    const out: Array<{ code: number; name: string }> = [];
    const skipped: string[] = [];
    for (const code of codes) {
      let name = '';
      try { name = String(this.api.GetNameFromTypeCode(code) || '').toUpperCase(); } catch (e) { continue; }
      if (!name) continue;
      if (NON_PRODUCT.test(name)) { skipped.push(name); continue; }
      out.push({ code, name });
    }
    this.report(0, out.length + ' tipos IFC de produto encontrados no arquivo (' + skipped.length + ' entidades de suporte ignoradas).');
    return out.length ? out : curated();
  }

  async streamGeometry(opts: ImportOptions): Promise<Map<number, IfcRawElement>> {
    const elements = new Map<number, IfcRawElement>();
    const types = this.typeCodes(opts);
    const scale = opts.unitScale ?? this.unitScale;

    // Passe 1: coleta bruta em coordenadas do modelo (x,y,z sem remapeamento).
    const raw: Array<{ id: number; cat: string; v: Float64Array; idx: Uint32Array; color: string; op: number }> = [];

    for (let ti = 0; ti < types.length; ti++) {
      const { code, name } = types[ti];
      this.report(0.10 + 0.35 * (ti / types.length), 'Lendo geometria: ' + prettyCategory(name) + '…');
      try {
        this.api.StreamAllMeshesWithTypes(this.modelID, [code], (mesh: any) => {
          const id = mesh.expressID;
          const geoms = mesh.geometries;
          const n = geoms.size();
          for (let g = 0; g < n; g++) {
            const placed = geoms.get(g);
            let geom: any = null;
            try { geom = this.api.GetGeometry(this.modelID, placed.geometryExpressID); } catch (e) { continue; }
            if (!geom) continue;
            const vsrc = this.api.GetVertexArray(geom.GetVertexData(), geom.GetVertexDataSize());
            const isrc = this.api.GetIndexArray(geom.GetIndexData(), geom.GetIndexDataSize());
            const m = placed.flatTransformation;
            const nv = vsrc.length / 6;
            const v = new Float64Array(nv * 3);
            for (let k = 0; k < nv; k++) {
              const x = vsrc[k * 6], y = vsrc[k * 6 + 1], z = vsrc[k * 6 + 2];
              v[k * 3] = (m[0] * x + m[4] * y + m[8] * z + m[12]) * scale;
              v[k * 3 + 1] = (m[1] * x + m[5] * y + m[9] * z + m[13]) * scale;
              v[k * 3 + 2] = (m[2] * x + m[6] * y + m[10] * z + m[14]) * scale;
            }
            const c = placed.color;
            const hex = '#' + [c.x, c.y, c.z].map((f: number) => clamp(Math.round(f * 255), 0, 255).toString(16).padStart(2, '0')).join('');
            raw.push({
              id, cat: name, v, idx: new Uint32Array(isrc),
              color: hex === '#000000' ? getStyle(name).color : hex,
              op: typeof c.w === 'number' && c.w > 0 ? c.w : 1,
            });
            geom.delete();
          }
        });
      } catch (e) {
        this.report(0, 'Categoria ' + name + ' ignorada: ' + String(e), 'warn');
      }
      await sleep(0);
    }

    if (!raw.length) return elements;

    // Detecção do eixo vertical.
    this.verticalAxis = opts.verticalAxis === 'auto' ? this.voteVerticalAxis(raw) : opts.verticalAxis;
    const vy = this.verticalAxis === 'y';

    // Passe 2: remapeia para (X, Y horizontal / Z vertical) e acumula por elemento.
    this.report(0.48, 'Projetando ' + raw.length + ' malhas…');
    for (let r = 0; r < raw.length; r++) {
      const item = raw[r];
      let el = elements.get(item.id);
      if (!el) {
        const st = getStyle(item.cat);
        el = {
          expressID: item.id, category: item.cat, tris: [], pts: [], triCount: 0, overflow: false,
          minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity, minZ: Infinity, maxZ: -Infinity,
          color: item.color || st.color, opacity: st.opacity,
        };
        elements.set(item.id, el);
      }
      const v = item.v, idx = item.idx;
      const nv = v.length / 3;
      const px = new Float64Array(nv), py = new Float64Array(nv);
      for (let k = 0; k < nv; k++) {
        const a = v[k * 3], b = v[k * 3 + 1], c = v[k * 3 + 2];
        const X = a;
        const Y = vy ? -c : b;
        const Z = vy ? b : c;
        px[k] = X; py[k] = Y;
        if (X < el.minX) el.minX = X; if (X > el.maxX) el.maxX = X;
        if (Y < el.minY) el.minY = Y; if (Y > el.maxY) el.maxY = Y;
        if (Z < el.minZ) el.minZ = Z; if (Z > el.maxZ) el.maxZ = Z;
        el.pts.push(X, Y);
      }
      for (let t = 0; t + 2 < idx.length; t += 3) {
        if (el.triCount >= opts.maxTris) { el.overflow = true; break; }
        const i0 = idx[t], i1 = idx[t + 1], i2 = idx[t + 2];
        const ax = px[i0], ay = py[i0], bx = px[i1], by = py[i1], cx = px[i2], cy = py[i2];
        const a2 = Math.abs((bx - ax) * (cy - ay) - (cx - ax) * (by - ay));
        if (a2 < 1e-7) continue; // face vertical -> degenerada na projeção
        el.tris.push(ax, ay, bx, by, cx, cy);
        el.triCount++;
      }
      if (r % 400 === 0) await sleep(0);
    }

    // Origem local = centro do bbox global em XY.
    let gminx = Infinity, gminy = Infinity, gmaxx = -Infinity, gmaxy = -Infinity;
    elements.forEach((e) => {
      if (e.minX < gminx) gminx = e.minX; if (e.maxX > gmaxx) gmaxx = e.maxX;
      if (e.minY < gminy) gminy = e.minY; if (e.maxY > gmaxy) gmaxy = e.maxY;
    });
    this.modelCenter = [(gminx + gmaxx) / 2, (gminy + gmaxy) / 2];
    return elements;
  }

  /** Vota o eixo vertical usando a espessura mínima das lajes. */
  private voteVerticalAxis(raw: Array<{ cat: string; v: Float64Array }>): 'z' | 'y' {
    let votesY = 0, votesZ = 0;
    for (const item of raw) {
      if (item.cat !== 'IFCSLAB' && item.cat !== 'IFCROOF') continue;
      const v = item.v;
      let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity, mnz = Infinity, mxz = -Infinity;
      for (let k = 0; k < v.length; k += 3) {
        if (v[k] < mnx) mnx = v[k]; if (v[k] > mxx) mxx = v[k];
        if (v[k + 1] < mny) mny = v[k + 1]; if (v[k + 1] > mxy) mxy = v[k + 1];
        if (v[k + 2] < mnz) mnz = v[k + 2]; if (v[k + 2] > mxz) mxz = v[k + 2];
      }
      const ex = mxx - mnx, ey = mxy - mny, ez = mxz - mnz;
      if (ey < ex && ey < ez) votesY++;
      if (ez < ex && ez < ey) votesZ++;
    }
    if (votesY + votesZ === 0) return 'z';
    return votesY > votesZ ? 'y' : 'z';
  }

  /* ---------- Pegadas (footprints) ---------- */
  buildElements(rawEls: Map<number, IfcRawElement>, meta: Map<number, IfcMeta>, opts: ImportOptions): BuiltElement[] {
    const out: BuiltElement[] = [];
    const cx0 = this.modelCenter[0], cy0 = this.modelCenter[1];

    rawEls.forEach((el) => {
      if (!(el.maxX > el.minX) || !(el.maxY > el.minY)) return;

      const hull = convexHull(el.pts);
      if (hull.length < 3) return;
      const hullArea = Math.abs(ringArea(hull));
      if (hullArea < 0.01) return;

      let rings: Ring[] = [];
      let mode: 'hull' | 'raster' = 'hull';

      const wantRaster = opts.contourMode === 'raster'
        || (opts.contourMode === 'auto' && !el.overflow && el.triCount > 2 && el.triCount <= opts.maxTris);

      if (wantRaster) {
        const minDim = Math.min(el.maxX - el.minX, el.maxY - el.minY);
        const cell = clamp(Math.min(opts.cellSize, Math.max(minDim / 3, 0.04)), 0.03, 2);
        const loops = rasterFootprint(el.tris, cell, 240 * 240);
        const built = ringsFromLoops(loops, Math.max(opts.simplifyTol, cell * 0.75), cell * cell * 6);
        if (built.length) {
          const a = Math.abs(ringArea(built[0]));
          // 'auto': só troca o hull pelo contorno se houver ganho real de forma.
          if (opts.contourMode === 'raster' || (a > 0.01 && a < hullArea * 0.97)) {
            rings = built; mode = 'raster';
          }
        }
      }

      if (!rings.length) rings = [dropCollinear(simplifyRing(hull, opts.simplifyTol))];

      const outer = rings[0];
      if (outer.length < 3) return;

      // Translada para a origem local do modelo.
      const shifted = rings.map((r) => r.map((p) => [p[0] - cx0, p[1] - cy0] as Vec2));

      let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
      shifted[0].forEach((p) => {
        if (p[0] < bx0) bx0 = p[0]; if (p[0] > bx1) bx1 = p[0];
        if (p[1] < by0) by0 = p[1]; if (p[1] > by1) by1 = p[1];
      });

      out.push({
        expressID: el.expressID,
        category: el.category,
        rings: shifted,
        area: Math.abs(ringArea(shifted[0])),
        perimeter: ringPerimeter(shifted[0]),
        centroid: ringCentroid(shifted[0]),
        bbox: [bx0, by0, bx1, by1],
        nv: shifted[0].length,
        baseHeight: el.minZ,
        topHeight: el.maxZ,
        color: el.color,
        opacity: el.opacity,
        mode,
        meta: meta.get(el.expressID) || {
          globalId: '', name: '', description: '', storey: '', storeyElevation: null, building: '', psets: {},
        },
      });
    });

    return out;
  }
}

/* =========================================================================
   8. AGRUPAMENTO DE LAJES EMPILHADAS
   ========================================================================= */

/**
 * Agrupa lajes idênticas e empilhadas do mesmo edifício num único objeto
 * nativo do Giraffe (levels + floorToFloor). Lajes únicas ou com espaçamento
 * irregular permanecem como elementos individuais.
 */
function groupStacked(
  elements: BuiltElement[],
  opts: ImportOptions,
  groupSet: Set<string>
): { groups: StackGroup[]; singles: BuiltElement[]; report: GroupReportRow[] } {
  const groups: StackGroup[] = [];
  const singles: BuiltElement[] = [];
  const report: GroupReportRow[] = [];

  const eligible: BuiltElement[] = [];
  for (const e of elements) {
    if (opts.groupSlabs && groupSet.has(e.category)) eligible.push(e);
    else singles.push(e);
  }

  /**
   * Bucketing em dois estágios. Chave grosseira exata (edifício, categoria,
   * nº de vértices, nº de anéis) e, dentro dela, clusterização do bounding box
   * por tolerância absoluta. Quantizar por arredondamento quebrava o
   * agrupamento quando um valor caía exatamente na fronteira do passo
   * (ex.: espessura 0,05 medida como 0,049999… num pavimento e 0,05 noutro).
   */
  const BBOX_TOL = 0.05;
  const coarse = new Map<string, BuiltElement[]>();
  for (const e of eligible) {
    const k = [e.meta.building || '·', e.category, e.nv, e.rings.length].join('|');
    const b = coarse.get(k);
    if (b) b.push(e); else coarse.set(k, [e]);
  }

  const buckets: BuiltElement[][] = [];
  coarse.forEach((list) => {
    const clusters: Array<{ bbox: number[]; items: BuiltElement[] }> = [];
    for (const e of list) {
      let hit: { bbox: number[]; items: BuiltElement[] } | null = null;
      for (const c of clusters) {
        if (Math.abs(c.bbox[0] - e.bbox[0]) <= BBOX_TOL &&
            Math.abs(c.bbox[1] - e.bbox[1]) <= BBOX_TOL &&
            Math.abs(c.bbox[2] - e.bbox[2]) <= BBOX_TOL &&
            Math.abs(c.bbox[3] - e.bbox[3]) <= BBOX_TOL) { hit = c; break; }
      }
      if (hit) hit.items.push(e);
      else clusters.push({ bbox: e.bbox.slice(), items: [e] });
    }
    clusters.forEach((c) => buckets.push(c.items));
  });

  buckets.forEach((list) => {
    const cat = list[0].category;
    list.sort((a, b) => a.baseHeight - b.baseHeight);
    const bases = list.map((e) => round(e.baseHeight, 3));
    const deltas: number[] = [];
    for (let i = 1; i < list.length; i++) deltas.push(round(list[i].baseHeight - list[i - 1].baseHeight, 3));

    if (list.length < opts.minLevels) {
      singles.push(...list);
      report.push({ category: cat, count: list.length, bases, deltas, verdict: 'individual (abaixo do mínimo de níveis)' });
      return;
    }

    // Particiona em corridas maximais de espaçamento constante (guloso, sem
    // repetir nem perder elementos na fronteira entre corridas).
    const verdicts: string[] = [];
    let i = 0;
    while (i < list.length) {
      let j = i + 1;
      let delta = NaN;
      const th0 = list[i].topHeight - list[i].baseHeight;
      const thTol = Math.max(0.02, th0 * 0.02);
      while (j < list.length) {
        const d = list[j].baseHeight - list[j - 1].baseHeight;
        if (!(d >= opts.f2fMin && d <= opts.f2fMax)) break;
        if (Math.abs((list[j].topHeight - list[j].baseHeight) - th0) > thTol) break;
        if (!Number.isFinite(delta)) { delta = d; j++; continue; }
        if (Math.abs(d - delta) > opts.f2fTolerance) break;
        j++;
      }
      const run = list.slice(i, j);
      if (run.length >= opts.minLevels && Number.isFinite(delta)) {
        const thickness = run[0].topHeight - run[0].baseHeight;
        // Espessura próxima do pé-direito => volume de pavimento (massa maciça).
        // Espessura muito menor => placa de piso (noFacade + slabThickness).
        const solid = thickness >= delta * opts.plateRatio;
        groups.push({
          members: run,
          levels: run.length,
          floorToFloor: delta,
          baseHeight: run[0].baseHeight,
          thickness,
          solid,
        });
        verdicts.push(run.length + '× f2f ' + round(delta, 3) + ' m → ' + (solid ? 'massa' : 'laje'));
        i = j;
      } else {
        singles.push(list[i]);
        verdicts.push('1 individual');
        i += 1;
      }
    }
    report.push({ category: cat, count: list.length, bases, deltas, verdict: verdicts.join(' · ') });
  });

  return { groups, singles, report };
}

/* =========================================================================
   9. CONSTRUÇÃO DAS FEATURES GEOJSON DO GIRAFFE
   ========================================================================= */

function psetProps(meta: IfcMeta, opts: ImportOptions): Record<string, unknown> {
  const props: Record<string, unknown> = {};
  if (!opts.flattenPsets) return props;
  let n = 0;
  for (const setName of Object.keys(meta.psets)) {
    for (const propName of Object.keys(meta.psets[setName])) {
      if (n >= opts.maxFlatProps) return props;
      const v = meta.psets[setName][propName];
      if (v === '' || v === null || v === undefined) continue;
      props['kv_p_' + sanitizeKey(setName) + '__' + sanitizeKey(propName)] = v;
      n++;
    }
  }
  return props;
}

function ringsToCoords(rings: Ring[], project: (x: number, y: number) => Vec2, z: number | null): number[][][] {
  return rings.map((r) => {
    const closed = r.concat([r[0]]);
    return closed.map((p) => {
      const ll = project(p[0], p[1]);
      return z === null ? [ll[0], ll[1]] : [ll[0], ll[1], z];
    });
  });
}

function buildFeatures(
  singles: BuiltElement[],
  groups: StackGroup[],
  opts: ImportOptions,
  anchor: Anchor,
  layerFor: (cat: string) => string,
  styleFor: (cat: string) => { color: string; opacity: number },
  tag: string
): any[] {
  const project = makeProjector(anchor);
  const features: any[] = [];

  const baseProps = (e: BuiltElement) => {
    const st = styleFor(e.category);
    const base = round(e.baseHeight + opts.zDatum, 3);
    return {
      layerId: layerFor(e.category),
      color: st.color,
      fillOpacity: st.opacity,
      stroke: st.color,
      strokeWidth: 1,
      forceStack: 'never',
      baseHeight: base,
      _baseHeight: base,
      kv_ifc_tag: tag,
      kv_ifc_expressId: e.expressID,
      kv_ifc_globalId: e.meta.globalId,
      kv_ifc_type: e.category,
      kv_ifc_category: prettyCategory(e.category),
      kv_ifc_name: e.meta.name,
      kv_ifc_description: e.meta.description,
      kv_ifc_storey: e.meta.storey,
      kv_ifc_building: e.meta.building,
      kv_ifc_footprintMode: e.mode,
      kv_ifc_psets: e.meta.psets,
    };
  };

  // ---- Elementos individuais ----
  for (const e of singles) {
    const h = Math.max(round(e.topHeight - e.baseHeight, 3), 0.05);
    const base = round(e.baseHeight + opts.zDatum, 3);
    features.push({
      type: 'Feature',
      properties: {
        ...baseProps(e),
        name: e.meta.name || prettyCategory(e.category) + ' ' + e.expressID,
        height: h,
        _height: round(base + h, 3),
        ...psetProps(e.meta, opts),
      },
      geometry: {
        type: 'Polygon',
        coordinates: ringsToCoords(e.rings, project, opts.writeVertexZ ? base : null),
      },
    });
  }

  // ---- Pilhas agrupadas (levels + floorToFloor) ----
  for (const g of groups) {
    const e = g.members[0];
    const base = round(g.baseHeight + opts.zDatum, 3);
    const f2f = round(g.floorToFloor, 3);
    const thick = Math.max(round(g.thickness, 3), 0.02);

    // ATENÇÃO: 'height' sobrepõe levels × floorToFloor no Giraffe — nunca gravar
    // em features agrupadas, sob pena de colapsar a pilha num único volume.
    const stackProps: Record<string, unknown> = g.solid
      ? {
          // Volume de pavimento: massa maciça, altura = levels × floorToFloor.
          levels: g.levels,
          floorToFloor: f2f,
          _height: round(base + f2f * g.levels, 3),
        }
      : {
          // Placa de piso: lâminas repetidas sem fachada.
          levels: g.levels,
          floorToFloor: f2f,
          noFacade: true,
          slabThickness: thick,
          _height: round(base + f2f * (g.levels - 1) + thick, 3),
        };

    features.push({
      type: 'Feature',
      properties: {
        ...baseProps(e),
        name: (e.meta.name || prettyCategory(e.category)) + ' · ' + g.levels + ' níveis',
        ...stackProps,
        kv_ifc_stacked: true,
        kv_ifc_stackKind: g.solid ? 'massa' : 'laje',
        kv_ifc_stackCount: g.levels,
        kv_ifc_stackF2F: f2f,
        kv_ifc_stackThickness: thick,
        kv_ifc_members: g.members.map((m) => m.meta.globalId || String(m.expressID)),
        kv_ifc_storeys: g.members.map((m) => m.meta.storey).filter(Boolean),
        ...psetProps(e.meta, opts),
      },
      geometry: {
        type: 'Polygon',
        coordinates: ringsToCoords(e.rings, project, opts.writeVertexZ ? base : null),
      },
    });
  }

  return features;
}

/* =========================================================================
   10. ESCRITA NO GIRAFFE
   ========================================================================= */

const _layerCache = new Map<string, string>();

async function ensureLayers(
  sdk: any, categories: CategoryState[], opts: ImportOptions, report: Reporter
): Promise<Record<string, string>> {
  const map: Record<string, string> = {};
  if (!opts.perCategoryLayers || !sdk) {
    categories.forEach((c) => { map[c.category] = 'default'; });
    return map;
  }
  for (const c of categories) {
    if (!c.enabled) continue;
    const cached = _layerCache.get(c.layerName);
    if (cached) { map[c.category] = cached; continue; }
    try {
      const r = await sdk.rpc.invoke('createDrawingLayer', [c.layerName]);
      const id = typeof r === 'string' ? r : (r?.id ?? r?.layerId ?? r?.name ?? c.layerName);
      map[c.category] = id;
      _layerCache.set(c.layerName, id);
      report(0, 'Camada criada: ' + c.layerName + ' (id: ' + id + ')', 'ok');
    } catch (e) {
      map[c.category] = 'default';
      report(0, 'Sem permissão/erro ao criar camada "' + c.layerName + '" — usando "default". ' + String(e), 'warn');
    }
  }
  return map;
}

async function writeToGiraffe(sdk: any, features: any[], opts: ImportOptions, report: Reporter): Promise<number> {
  let written = 0;
  const chunks: any[][] = [];
  for (let i = 0; i < features.length; i += opts.chunkSize) chunks.push(features.slice(i, i + opts.chunkSize));

  for (let i = 0; i < chunks.length; i++) {
    const chunk = chunks[i];
    let ok = false;
    if (opts.writer === 'createRawSections') {
      try {
        await sdk.rpc.invoke('createRawSections', [chunk]);
        ok = true;
      } catch (e) {
        report(0, 'createRawSections falhou no lote ' + (i + 1) + ' — tentando importRawSections. ' + String(e), 'warn');
      }
    }
    if (!ok) {
      try {
        await sdk.rpc.invoke('importRawSections', [{ type: 'FeatureCollection', features: chunk }]);
        ok = true;
      } catch (e) {
        report(0, 'importRawSections falhou no lote ' + (i + 1) + ': ' + String(e), 'error');
      }
    }
    if (ok) written += chunk.length;
    report(0.85 + 0.15 * ((i + 1) / chunks.length), 'Gravando lote ' + (i + 1) + '/' + chunks.length + '…');
    await sleep(0);
  }
  return written;
}

async function deleteTagged(sdk: any, tagPrefix: string, report: Reporter): Promise<number> {
  const fc = sdk.giraffeState.get('rawSections');
  const feats = fc?.features || [];
  const ids = feats
    .filter((f: any) => typeof f?.properties?.kv_ifc_tag === 'string' && f.properties.kv_ifc_tag.startsWith(tagPrefix))
    .map((f: any) => f.properties.id)
    .filter(Boolean);
  if (!ids.length) { report(0, 'Nenhuma seção importada por este app foi encontrada.', 'info'); return 0; }
  await sdk.rpc.invoke('deleteRawSections', [ids]);
  report(0, ids.length + ' seções removidas.', 'ok');
  return ids.length;
}

function useLogger() {

/** Vista em planta dos footprints extraídos (validação visual antes da injeção). */
function PlanPreview({ singles, groups, styleFor }: {
  singles: BuiltElement[]; groups: StackGroup[];
  styleFor: (c: string) => { color: string; opacity: number };
}) {
  const all = useMemo(() => singles.concat(groups.map((g) => g.members[0])), [singles, groups]);
  const box = useMemo(() => {
    let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
    all.forEach((e) => e.rings[0].forEach((p) => {
      if (p[0] < a) a = p[0]; if (p[0] > c) c = p[0];
      if (p[1] < b) b = p[1]; if (p[1] > d) d = p[1];
    }));
    return { a, b, c, d };
  }, [all]);

  if (!all.length || !Number.isFinite(box.a)) {
    return <p className="hint">Nenhuma geometria para pré-visualizar.</p>;
  }
  const w = Math.max(box.c - box.a, 1), h = Math.max(box.d - box.b, 1);
  const pad = Math.max(w, h) * 0.04;
  const stackIds = new Set(groups.map((g) => g.members[0].expressID));

  return (
    <svg viewBox={`${box.a - pad} ${-(box.d + pad)} ${w + pad * 2} ${h + pad * 2}`}
      style={{ width: '100%', height: 260, border: '1px solid var(--md-sys-color-outline-variant)',
        background: 'var(--md-sys-color-surface-container-low)' }}
      role="img" aria-label="Pré-visualização em planta dos elementos importados">
      {all.map((e) => {
        const st = styleFor(e.category);
        const d = e.rings.map((r) => 'M' + r.map((p) => p[0].toFixed(2) + ' ' + (-p[1]).toFixed(2)).join('L') + 'Z').join(' ');
        const stacked = stackIds.has(e.expressID);
        return (
          <path key={e.expressID} d={d} fill={st.color} fillOpacity={st.opacity * 0.55} fillRule="evenodd"
            stroke={stacked ? 'var(--md-sys-color-primary)' : st.color}
            strokeWidth={Math.max(w, h) / (stacked ? 260 : 700)} />
        );
      })}
    </svg>
  );
}
