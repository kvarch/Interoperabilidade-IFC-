  const [sdkReady, setSdkReady] = useState(false);
  const [elements, setElements] = useState<BuiltElement[]>([]);
  const [categories, setCategories] = useState<CategoryState[]>([]);
  const [opts, setOpts] = useState<ImportOptions>(DEFAULT_OPTIONS);
  const [anchor, setAnchor] = useState<Anchor>({ lon: -46.6333, lat: -23.5505, rotation: 0, source: 'padrão (São Paulo)' });
  const [captureClick, setCaptureClick] = useState(false);
  const [banner, setBanner] = useState<{ lv: 'ok' | 'error' | 'info'; msg: string } | null>(null);
  const [stats, setStats] = useState({ meshes: 0, unit: 1, axis: 'z', georef: '—', written: 0 });
  const sdkRef = useRef<any>(null);
  const fileRef = useRef<HTMLInputElement | null>(null);
  const tagRef = useRef('kvifc');

  const report = useCallback<Reporter>((v, msg, lv) => {
    setProgress({ v: clamp(v, 0, 1), m: msg });
    if (msg) log.push(msg, lv || 'info');
  }, [log]);

  /* ---------- tema ---------- */
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const apply = () => setTheme(mq.matches ? 'light' : 'dark');
    apply();
    mq.addEventListener('change', apply);
    return () => mq.removeEventListener('change', apply);
  }, []);
  useEffect(() => {
    document.documentElement.className = theme;
  }, [theme]);

  /* ---------- SDK do Giraffe ---------- */
  useEffect(() => {
    let alive = true;
    loadSdk().then((sdk) => {
      if (!alive) return;
      sdkRef.current = sdk;
      setSdkReady(true);
      log.push('SDK @gi-nx/iframe-sdk carregado.', 'ok');
      resolveAnchorFromProject(sdk);
    }).catch((e) => {
      log.push('SDK do Giraffe indisponível (modo pré-visualização): ' + String(e), 'warn');
    });
    return () => { alive = false; };
  }, []);

  const resolveAnchorFromProject = useCallback((sdk: any) => {
    const tryCenter = (): Anchor | null => {
      const keys = ['projectBounds', 'project', 'mapView', 'rawSections'];
      for (const k of keys) {
        let v: any = null;
        try { v = sdk.giraffeState.get(k); } catch (e) { continue; }
        if (!v) continue;
        if (k === 'mapView' && Array.isArray(v.center) && v.center.length >= 2) {
          return { lon: v.center[0], lat: v.center[1], rotation: 0, source: 'centro da vista do mapa' };
        }
        const feats = v.features || (v.geometry ? [v] : null);
        if (!feats || !feats.length) continue;
        let sx = 0, sy = 0, n = 0;
        for (const f of feats) {
          const g = f?.geometry;
          if (!g) continue;
          const flat = JSON.stringify(g.coordinates).match(/-?\d+\.\d+/g) || [];
          for (let i = 0; i + 1 < flat.length; i += 2) { sx += parseFloat(flat[i]); sy += parseFloat(flat[i + 1]); n++; }
          if (n > 4000) break;
        }
        if (n > 0) return { lon: sx / n, lat: sy / n, rotation: 0, source: 'centróide de "' + k + '"' };
      }
      return null;
    };
    const a = tryCenter();
    if (a) {
      setAnchor((prev) => ({ ...a, rotation: prev.rotation }));
      log.push('Âncora resolvida por ' + a.source + ': ' + a.lon.toFixed(6) + ', ' + a.lat.toFixed(6), 'ok');
    } else {
      log.push('Não foi possível resolver a âncora pelo projeto — informe manualmente.', 'warn');
    }
  }, [log]);

  /* ---------- captura de clique no mapa ---------- */
  useEffect(() => {
    if (!captureClick || !sdkRef.current) return;
    const sdk = sdkRef.current;
    let listenerId: any = null;
    const read = () => {
      const c = sdk.giraffeState.get('mapSelectCoord');
      if (Array.isArray(c) && c.length >= 2) {
        setAnchor((p) => ({ ...p, lon: c[0], lat: c[1], source: 'ponto clicado no mapa' }));
        setCaptureClick(false);
        log.push('Âncora definida pelo clique: ' + c[0].toFixed(6) + ', ' + c[1].toFixed(6), 'ok');
      }
    };
    try { listenerId = sdk.giraffeState.addListener(['mapSelectCoord'], read); } catch (e) { /* noop */ }
    const poll = window.setInterval(read, 500); // addListener não dispara em todos os contextos
    return () => {
      window.clearInterval(poll);
      if (listenerId !== null) { try { sdk.giraffeState.removeListener(listenerId); } catch (e) { /* noop */ } }
    };
  }, [captureClick, log]);

  /* ---------- pipeline de parsing ---------- */
  const parseFile = useCallback(async (file: File) => {
    if (busy) return;
    setBusy(true);
    setBanner(null);
    setElements([]);
    setCategories([]);
    setFileName(file.name);
    tagRef.current = 'kvifc:' + Date.now().toString(36);
    log.push('Arquivo: ' + file.name + ' (' + (file.size / 1048576).toFixed(2) + ' MB)');

    let engine: IfcImportEngine | null = null;
    try {
      const api = await loadWebIfc(report);
      engine = new IfcImportEngine(api, _webifc, report);

      report(0.08, 'Abrindo modelo…');
      engine.open(await file.arrayBuffer());

      const scale = engine.detectUnitScale();
      report(0.09, 'Unidade de comprimento detectada: fator ' + scale + ' → metros');

      const geo = engine.detectGeoRef();
      if (geo) {
        report(0.09, 'IfcSite georreferenciado: ' + geo.lat.toFixed(6) + ', ' + geo.lon.toFixed(6), 'ok');
      }

      report(0.10, 'Lendo hierarquia espacial e Psets…');
      const meta = engine.readMeta();
      report(0.10, meta.size + ' elementos com metadados/Psets.');

      const rawEls = await engine.streamGeometry(opts);
      report(0.55, rawEls.size + ' elementos com geometria. Eixo vertical: ' + engine.verticalAxis.toUpperCase());

      report(0.60, 'Extraindo pegadas (footprints)…');
      const built = engine.buildElements(rawEls, meta, opts);
      await sleep(0);

      const counts = new Map<string, number>();
      built.forEach((e) => counts.set(e.category, (counts.get(e.category) || 0) + 1));
      const cats: CategoryState[] = [];
      counts.forEach((count, category) => {
        const st = getStyle(category);
        const on = !OFF_BY_DEFAULT.has(category);
        cats.push({
          category, count, enabled: on, group: on,
          color: st.color, opacity: st.opacity, layerName: 'IFC · ' + prettyCategory(category),
        });
      });
      cats.sort((a, b) => b.count - a.count);
      log.push('Classificação IFC lida do arquivo: ' + cats.map((c) => prettyCategory(c.category) + ' (' + c.count + ')').join(', '));

      setElements(built);
      setCategories(cats);
      setStats({
        meshes: rawEls.size, unit: scale, axis: engine.verticalAxis,
        georef: geo ? geo.lat.toFixed(5) + ', ' + geo.lon.toFixed(5) : '—', written: 0,
      });
      if (geo) setAnchor((p) => ({ ...p, lon: geo.lon, lat: geo.lat, source: 'IfcSite (georreferência do modelo)' }));

      report(1, built.length + ' elementos prontos para injeção.', 'ok');
      setBanner({ lv: 'ok', msg: built.length + ' elementos processados em ' + cats.length + ' categorias BIM.' });
    } catch (e) {
      report(1, 'Falha na leitura do IFC: ' + String(e), 'error');
      setBanner({ lv: 'error', msg: 'Falha na leitura do IFC. Verifique o log de diagnóstico.' });
    } finally {
      if (engine) engine.close();
      setBusy(false);
    }
  }, [busy, opts, report, log]);

  /* ---------- agrupamento reativo ---------- */
  const enabledSet = useMemo(() => new Set(categories.filter((c) => c.enabled).map((c) => c.category)), [categories]);
  const visible = useMemo(() => elements.filter((e) => enabledSet.has(e.category)), [elements, enabledSet]);
  const groupSet = useMemo(
    () => new Set(categories.filter((c) => c.enabled && c.group).map((c) => c.category)),
    [categories]
  );
  const { groups, singles, report: groupReport } = useMemo(
    () => groupStacked(visible, opts, groupSet),
    [visible, opts, groupSet]
  );

  const styleFor = useCallback((cat: string) => {
    const c = categories.find((x) => x.category === cat);
    return c ? { color: c.color, opacity: c.opacity } : getStyle(cat);
  }, [categories]);

  const collapsedLevels = useMemo(() => groups.reduce((s, g) => s + g.levels, 0), [groups]);
  const featureCount = singles.length + groups.length;

  /* ---------- injeção ---------- */
  const inject = useCallback(async () => {
    const sdk = sdkRef.current;
    if (!sdk) { setBanner({ lv: 'error', msg: 'SDK do Giraffe indisponível nesta janela.' }); return; }
    if (!featureCount) { setBanner({ lv: 'error', msg: 'Nenhum elemento selecionado para injetar.' }); return; }
    setBusy(true); setBanner(null);
    try {
      report(0.80, 'Preparando camadas por categoria BIM…');
      const layerMap = await ensureLayers(sdk, categories, opts, report);
      const layerFor = (cat: string) => layerMap[cat] || 'default';

      report(0.83, 'Convertendo para GeoJSON georreferenciado…');
      const features = buildFeatures(singles, groups, opts, anchor, layerFor, styleFor, tagRef.current);
      log.push('Features geradas: ' + features.length + ' (' + groups.length + ' pilhas agrupadas).');

      const written = await writeToGiraffe(sdk, features, opts, report);
      setStats((s) => ({ ...s, written }));
      report(1, written + ' seções injetadas no Giraffe.', 'ok');
      setBanner({
        lv: written === features.length ? 'ok' : 'error',
        msg: written + ' de ' + features.length + ' seções injetadas. Ative as camadas no painel do Giraffe se necessário.',
      });
    } catch (e) {
      report(1, 'Falha na injeção: ' + String(e), 'error');
      setBanner({ lv: 'error', msg: 'Falha na injeção. Verifique o log de diagnóstico.' });
    } finally {
      setBusy(false);
    }
  }, [categories, opts, anchor, singles, groups, featureCount, styleFor, report, log]);

  const clearImport = useCallback(async () => {
    const sdk = sdkRef.current;
    if (!sdk) return;
    setBusy(true);
    try { await deleteTagged(sdk, 'kvifc', report); }
    catch (e) { report(0, 'Falha ao remover: ' + String(e), 'error'); }
    finally { setBusy(false); }
  }, [report]);

  /* ---------- handlers de arquivo ---------- */
  const onDrop = (ev: React.DragEvent) => {
    ev.preventDefault(); setDragOver(false);
    const f = ev.dataTransfer.files?.[0];
    if (f && /\.ifc$/i.test(f.name)) parseFile(f);
    else setBanner({ lv: 'error', msg: 'Selecione um arquivo com extensão .ifc' });
  };

  function setOpt<K extends keyof ImportOptions>(k: K, v: ImportOptions[K]) {
    setOpts((p) => ({ ...p, [k]: v }));
  }

  /* ======================= RENDER ======================= */
  return (
    <div className="app-shell">
      <header className="app-header">
        <div className="logo-container">
          <span className="brand-logo" role="img" aria-label="Königsberger Vannucchi Arquitetos Associados" />
        </div>
        <h1 className="app-title">
          Importador IFC
          <small>{fileName || 'Nenhum arquivo carregado'}</small>
        </h1>
        <button className="icon-btn" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
          aria-label={'Alternar para tema ' + (theme === 'dark' ? 'claro' : 'escuro')} title="Alternar tema">
          {theme === 'dark' ? '☾' : '☀'}
        </button>
      </header>

      <nav className="app-tabs" role="tablist" aria-label="Seções do aplicativo">
        <button role="tab" aria-selected={tab === 'import'} onClick={() => setTab('import')}>Importar</button>
        <button role="tab" aria-selected={tab === 'layers'} onClick={() => setTab('layers')}>Camadas</button>
        <button role="tab" aria-selected={tab === 'log'} onClick={() => setTab('log')}>Log</button>
      </nav>

      <main className="app-main">
        {banner && (
          <div className={'banner banner-' + (banner.lv === 'ok' ? 'ok' : banner.lv === 'error' ? 'error' : 'info')} role="status">
            {banner.msg}
          </div>
        )}

        {tab === 'import' && (
          <>
            <section className="card" aria-labelledby="sec-arquivo">
              <h2 id="sec-arquivo">1 · Arquivo IFC</h2>
              <div className={'dropzone' + (dragOver ? ' is-over' : '')}
                onClick={() => fileRef.current?.click()}
                onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') fileRef.current?.click(); }}
                onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={onDrop}
                role="button" tabIndex={0} aria-label="Selecionar ou arrastar um arquivo IFC">
                <strong>{fileName || 'Arraste um arquivo .ifc ou clique para selecionar'}</strong>
                <span>Parsing local no navegador via WebAssembly (web-ifc) — nada é enviado a servidores.</span>
              </div>
              <input ref={fileRef} type="file" accept=".ifc" className="sr-only" id="ifc-file"
                onChange={(e) => { const f = e.target.files?.[0]; if (f) parseFile(f); }} />
              <label className="sr-only" htmlFor="ifc-file">Arquivo IFC</label>
              <Progress value={progress.v} message={progress.m} />
              <div className="kpi-grid">
                <Kpi value={elements.length} label="Elementos" />
                <Kpi value={categories.length} label="Categorias" />
                <Kpi value={featureCount} label="Features" />
                <Kpi value={groups.length} label="Pilhas" />
                <Kpi value={collapsedLevels} label="Níveis" />
              </div>
            </section>

            <section className="card" aria-labelledby="sec-geo">
              <h2 id="sec-geo">2 · Georreferenciamento</h2>
              <div className="field-row">
                <div className="field">
                  <label htmlFor="lon">Longitude da âncora</label>
                  <input id="lon" type="number" step="0.000001" value={anchor.lon}
                    onChange={(e) => setAnchor((p) => ({ ...p, lon: parseFloat(e.target.value) || 0, source: 'manual' }))} />
                </div>
                <div className="field">
                  <label htmlFor="lat">Latitude da âncora</label>
                  <input id="lat" type="number" step="0.000001" value={anchor.lat}
                    onChange={(e) => setAnchor((p) => ({ ...p, lat: parseFloat(e.target.value) || 0, source: 'manual' }))} />
                </div>
              </div>
              <div className="field-row">
                <div className="field">
                  <label htmlFor="rot">Rotação / norte (°)</label>
                  <input id="rot" type="number" step="0.5" value={anchor.rotation}
                    onChange={(e) => setAnchor((p) => ({ ...p, rotation: parseFloat(e.target.value) || 0 }))} />
                </div>
                <div className="field">
                  <label htmlFor="datum">Cota de implantação (m)</label>
                  <input id="datum" type="number" step="0.1" value={opts.zDatum}
                    onChange={(e) => setOpt('zDatum', parseFloat(e.target.value) || 0)} />
                </div>
              </div>
              <p className="hint">Origem: {anchor.source}. O centro do bounding box do modelo é ancorado nestas coordenadas.</p>
              <div className="btn-row">
                <button className="btn btn-outlined" disabled={!sdkReady}
                  onClick={() => sdkRef.current && resolveAnchorFromProject(sdkRef.current)}>Usar centro do projeto</button>
                <button className="btn btn-outlined" disabled={!sdkReady} onClick={() => setCaptureClick(true)}>
                  {captureClick ? 'Aguardando clique…' : 'Capturar clique no mapa'}
                </button>
              </div>
            </section>

            <section className="card" aria-labelledby="sec-agr">
              <h2 id="sec-agr">3 · Agrupamento de lajes empilhadas</h2>
              <label className="check">
                <input type="checkbox" checked={opts.groupSlabs} onChange={(e) => setOpt('groupSlabs', e.target.checked)} />
                Colapsar lajes idênticas e empilhadas em objetos nativos (levels + floorToFloor)
              </label>
              <div className="field-row">
                <div className="field">
                  <label htmlFor="minlv">Mínimo de níveis</label>
                  <input id="minlv" type="number" min={2} max={50} value={opts.minLevels}
                    onChange={(e) => setOpt('minLevels', clamp(parseInt(e.target.value, 10) || 2, 2, 50))} />
                </div>
                <div className="field">
                  <label htmlFor="tolf2f">Tolerância pé-direito (m)</label>
                  <input id="tolf2f" type="number" step="0.01" value={opts.f2fTolerance}
                    onChange={(e) => setOpt('f2fTolerance', parseFloat(e.target.value) || 0.08)} />
                </div>
              </div>
              <div className="field-row">
                <div className="field">
                  <label htmlFor="f2fmin">Pé-direito mín. (m)</label>
                  <input id="f2fmin" type="number" step="0.1" value={opts.f2fMin}
                    onChange={(e) => setOpt('f2fMin', parseFloat(e.target.value) || 1.8)} />
                </div>
                <div className="field">
                  <label htmlFor="f2fmax">Pé-direito máx. (m)</label>
                  <input id="f2fmax" type="number" step="0.1" value={opts.f2fMax}
                    onChange={(e) => setOpt('f2fMax', parseFloat(e.target.value) || 12)} />
                </div>
              </div>
              <div className="field-row">
                <div className="field">
                  <label htmlFor="pratio">Razão espessura/pé-direito p/ virar massa</label>
                  <input id="pratio" type="number" step="0.05" min="0.05" max="1" value={opts.plateRatio}
                    onChange={(e) => setOpt('plateRatio', clamp(parseFloat(e.target.value) || 0.85, 0.05, 1))} />
                </div>
                <div className="field">
                  <label htmlFor="dummy-sp">&nbsp;</label>
                  <div style={{ minHeight: 48, display: 'flex', alignItems: 'center', fontSize: 12,
                    color: 'var(--md-sys-color-on-surface-variant)' }}>
                    {groups.filter((g) => g.solid).length} massa(s) · {groups.filter((g) => !g.solid).length} laje(s)
                  </div>
                </div>
              </div>
              <p className="hint">
                {groups.length} pilha(s) detectada(s), colapsando {collapsedLevels} elementos.
                Quando a espessura do elemento atinge essa fração do pé-direito, a pilha é
                contígua e vira massa maciça (altura = níveis × pé-direito); abaixo disso vira
                placa repetida, com <code>noFacade</code> e <code>slabThickness</code>, preservando os vazios.
                Ative ou desative o agrupamento por categoria na aba Camadas.
              </p>
            </section>

            <section className="card" aria-labelledby="sec-prev">
              <h2 id="sec-prev">4 · Pré-visualização em planta</h2>
              <PlanPreview singles={singles} groups={groups} styleFor={styleFor} />
              <p className="hint">Contorno destacado = pilha agrupada. Preto/cinza = elemento individual.</p>
            </section>

            <section className="card" aria-labelledby="sec-inj">
              <h2 id="sec-inj">5 · Injeção no Giraffe</h2>
              {!sdkReady && <div className="banner banner-info">SDK do Giraffe não detectado — modo pré-visualização.</div>}
              <div className="btn-row">
                <button className="btn btn-primary" disabled={busy || !featureCount || !sdkReady} onClick={inject}>
                  Injetar {featureCount} feature(s)
                </button>
                <button className="btn btn-danger" disabled={busy || !sdkReady} onClick={clearImport}>
                  Remover importação
                </button>
              </div>
            </section>
          </>
        )}

        {tab === 'layers' && (
          <>
            <section className="card" aria-labelledby="sec-cat">
              <h2 id="sec-cat">Categorias BIM → camadas do Giraffe</h2>
              <label className="check">
                <input type="checkbox" checked={opts.perCategoryLayers}
                  onChange={(e) => setOpt('perCategoryLayers', e.target.checked)} />
                Criar uma camada de desenho por categoria (desmarcado: tudo em "default")
              </label>
              {!categories.length && <p className="hint">Carregue um arquivo IFC para listar as categorias.</p>}
              {!!categories.length && (
                <table className="kv">
                  <thead>
                    <tr>
                      <th scope="col">Incluir</th>
                      <th scope="col">Agrupar</th>
                      <th scope="col">Categoria IFC</th>
                      <th scope="col" className="num">Elem.</th>
                      <th scope="col">Cor</th>
                      <th scope="col">Camada</th>
                    </tr>
                  </thead>
                  <tbody>
                    {categories.map((c, i) => (
                      <tr key={c.category}>
                        <td>
                          <label className="cell-check">
                            <input type="checkbox" checked={c.enabled} aria-label={'Incluir ' + prettyCategory(c.category)}
                              onChange={(e) => setCategories((p) => p.map((x, j) => (j === i ? { ...x, enabled: e.target.checked } : x)))} />
                          </label>
                        </td>
                        <td>
                          <label className="cell-check">
                            <input type="checkbox" checked={c.group} disabled={!c.enabled}
                              aria-label={'Agrupar pilhas de ' + prettyCategory(c.category)}
                              onChange={(e) => setCategories((p) => p.map((x, j) => (j === i ? { ...x, group: e.target.checked } : x)))} />
                          </label>
                        </td>
                        <td>{prettyCategory(c.category)}</td>
                        <td className="num">{c.count}</td>
                        <td>
                          <input type="color" value={c.color} aria-label={'Cor de ' + prettyCategory(c.category)}
                            onChange={(e) => setCategories((p) => p.map((x, j) => (j === i ? { ...x, color: e.target.value } : x)))} />
                        </td>
                        <td>
                          <input type="text" value={c.layerName} aria-label={'Nome da camada de ' + prettyCategory(c.category)}
                            className="cell-input"
                            onChange={(e) => setCategories((p) => p.map((x, j) => (j === i ? { ...x, layerName: e.target.value } : x)))} />
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </section>

            <section className="card" aria-labelledby="sec-adv">
              <h2 id="sec-adv">Extração de geometria</h2>
              <div className="field-row">
                <div className="field">
                  <label htmlFor="cmode">Modo de contorno</label>
                  <select id="cmode" value={opts.contourMode} onChange={(e) => setOpt('contourMode', e.target.value as any)}>
                    <option value="auto">Automático (híbrido)</option>
                    <option value="hull">Envoltória convexa</option>
                    <option value="raster">Contorno rasterizado</option>
                  </select>
                </div>
                <div className="field">
                  <label htmlFor="cell">Célula do raster (m)</label>
                  <input id="cell" type="number" step="0.05" min="0.03" value={opts.cellSize}
                    onChange={(e) => setOpt('cellSize', clamp(parseFloat(e.target.value) || 0.25, 0.03, 2))} />
                </div>
              </div>
              <div className="field-row">
                <div className="field">
                  <label htmlFor="vaxis">Eixo vertical</label>
                  <select id="vaxis" value={opts.verticalAxis} onChange={(e) => setOpt('verticalAxis', e.target.value as any)}>
                    <option value="auto">Detectar (atual: {stats.axis.toUpperCase()})</option>
                    <option value="z">Z (padrão IFC)</option>
                    <option value="y">Y</option>
                  </select>
                </div>
                <div className="field">
                  <label htmlFor="simp">Simplificação (m)</label>
                  <input id="simp" type="number" step="0.01" value={opts.simplifyTol}
                    onChange={(e) => setOpt('simplifyTol', clamp(parseFloat(e.target.value) || 0.12, 0.01, 2))} />
                </div>
              </div>
              <label className="check">
                <input type="checkbox" checked={opts.includeAllTypes}
                  onChange={(e) => setOpt('includeAllTypes', e.target.checked)} />
                Ler todos os tipos IFC presentes no arquivo (desmarcado: apenas a lista curada)
              </label>
              <label className="check">
                <input type="checkbox" checked={opts.flattenPsets} onChange={(e) => setOpt('flattenPsets', e.target.checked)} />
                Achatar Psets em propriedades kv_p_* (além do objeto kv_ifc_psets)
              </label>
              <label className="check">
                <input type="checkbox" checked={opts.writeVertexZ} onChange={(e) => setOpt('writeVertexZ', e.target.checked)} />
                Gravar cota Z nos vértices do GeoJSON
              </label>
              <p className="hint">Alterações de contorno e eixo exigem recarregar o arquivo IFC.</p>
            </section>
          </>
        )}

        {tab === 'log' && (
          <>
            <section className="card" aria-labelledby="sec-diag">
              <h2 id="sec-diag">Diagnóstico do ambiente</h2>
              <table className="kv">
                <tbody>
                  <tr><td>SDK Giraffe</td><td>{sdkReady ? 'carregado' : 'indisponível'}</td></tr>
                  <tr><td>web-ifc / WASM</td><td>{_wasmBaseUsed || 'não inicializado'}</td></tr>
                  <tr><td>Malhas lidas</td><td className="num">{stats.meshes}</td></tr>
                  <tr><td>Fator de unidade</td><td className="num">{stats.unit}</td></tr>
                  <tr><td>Eixo vertical</td><td>{stats.axis.toUpperCase()}</td></tr>
                  <tr><td>Georreferência IFC</td><td>{stats.georef}</td></tr>
                  <tr><td>Âncora aplicada</td><td>{anchor.lat.toFixed(6)}, {anchor.lon.toFixed(6)}</td></tr>
                  <tr><td>Seções gravadas</td><td className="num">{stats.written}</td></tr>
                  <tr><td>Tag da sessão</td><td>{tagRef.current}</td></tr>
                </tbody>
              </table>
            </section>
            <section className="card" aria-labelledby="sec-grp">
              <h2 id="sec-grp">Relatório de agrupamento</h2>
              {!groupReport.length && <p className="hint">Nenhum conjunto candidato a agrupamento.</p>}
              {!!groupReport.length && (
                <table className="kv">
                  <thead>
                    <tr>
                      <th scope="col">Categoria</th>
                      <th scope="col" className="num">Qtd.</th>
                      <th scope="col">Cotas de base (m)</th>
                      <th scope="col">Deltas (m)</th>
                      <th scope="col">Resultado</th>
                    </tr>
                  </thead>
                  <tbody>
                    {groupReport.slice(0, 60).map((r, i) => (
                      <tr key={i}>
                        <td>{prettyCategory(r.category)}</td>
                        <td className="num">{r.count}</td>
                        <td>{r.bases.slice(0, 8).join(', ')}{r.bases.length > 8 ? '…' : ''}</td>
                        <td>{r.deltas.slice(0, 8).join(', ')}{r.deltas.length > 8 ? '…' : ''}</td>
                        <td>{r.verdict}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
              <p className="hint">
                Um conjunto só agrupa quando bbox, contagem de vértices e espessura coincidem
                e os deltas de cota são constantes dentro da tolerância.
              </p>
            </section>

            <section className="card" aria-labelledby="sec-log">
              <h2 id="sec-log">Log de execução</h2>
              <div className="log" role="log" aria-live="polite">
                {log.entries.map((e, i) => (
                  <div key={i} className={'lv-' + e.lv}>
                    <span className="ts">[{e.t}] </span>{e.msg}
                  </div>
                ))}
                {!log.entries.length && <div className="ts">Sem registros.</div>}
              </div>
              <div className="btn-row">
                <button className="btn btn-outlined" onClick={log.clear}>Limpar log</button>
                <button className="btn btn-outlined"
                  onClick={() => navigator.clipboard?.writeText(log.entries.map((e) => '[' + e.t + '] ' + e.msg).join('\n'))}>
                  Copiar log
                </button>
              </div>
            </section>
            <section className="card" aria-labelledby="sec-lic">
              <h2 id="sec-lic">Licenças de terceiros</h2>
              <p className="hint">
                Parsing IFC por <strong>web-ifc</strong> (ThatOpen Company) — código aberto com uso comercial permitido:{' '}
                <a href="https://github.com/ThatOpen/engine_web-ifc/blob/main/LICENSE.md" target="_blank" rel="noopener noreferrer"
                  style={{ color: 'var(--md-sys-color-primary)' }}>ver licença</a>.
                React (MIT). Nenhum dado do modelo sai do navegador.
              </p>
            </section>
          </>
        )}
      </main>

      <footer className="app-footer">
        <span>{APP_VERSION} · © 2026 Königsberger Vannucchi</span>
        <span>{featureCount ? featureCount + ' features prontas' : 'aguardando IFC'}</span>
      </footer>
    </div>
  );
}

const rootEl = document.getElementById('root');
if (rootEl) (ReactDOM as any).createRoot(rootEl).render(<App />);

</script>
</body>
</html>
